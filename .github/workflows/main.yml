name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      # Provide dummy env vars so Pydantic BaseSettings initializes during tests
      DATABASE_URL: "postgresql://postgres:dummy@localhost:5432/dummydb"
      REDIS_URL: "redis://localhost:6379/0"
      SECRET_KEY: "ci-cd-super-secret-key-for-testing-1234567890"
      TEST_DATABASE_URL: "sqlite:///./test.db"
      ALLOWED_ORIGINS: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          cd backend
          pytest -v
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd frontend
          npm install
      - name: Run lint, typecheck, and tests
        run: |
          cd frontend
          npm run lint
          npx tsc --noEmit
          npm test -- --watchAll=false
